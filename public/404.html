    <title>CBT Online Assessment System</title>
    <script>
      // Single Page Apps for GitHub Pages redirect
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/?path=' + l.pathname.slice(1) +
        (l.search ? '&' + l.search.slice(1) : '') +
        l.hash
      );
    </script>
